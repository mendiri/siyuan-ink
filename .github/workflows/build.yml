name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SiYuanInk-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en la release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=$((GITHUB_RUN_NUMBER + 100))
          cp app/build/outputs/apk/debug/app-debug.apk SiYuanInk.apk
          gh release delete latest --yes --cleanup-tag || true
          # La app lee "build N" del título para saber si hay actualización.
          gh release create latest SiYuanInk.apk \
            --title "SiYuan Ink build ${BUILD} (${GITHUB_SHA::7})" \
            --notes "APK compilado automáticamente desde ${GITHUB_SHA}." \
            --prerelease --target "${GITHUB_SHA}"
